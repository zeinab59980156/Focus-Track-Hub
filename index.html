<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusTrack Hub</title>
</head>
<body style="margin:0;background:#0B1220;color:white;display:flex;justify-content:center;padding:15px;font-family:Arial">
<div style="width:100%;max-width:380px;background:#151E32;border-radius:30px;padding:15px">
<div style="width:100%;height:320px;background:#000;border-radius:20px;overflow:hidden"><video id="cam" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1)"></video></div>
<button onclick="openCam()" style="width:100%;background:#7c5cff;color:white;border:none;padding:14px;border-radius:14px;margin-top:15px;font-size:16px">📷 شغلي الكاميرا</button>
<div id="msg" style="text-align:center;margin-top:12px;color:#f87171">اضغطي شغلي الكاميرا واعملي سماح</div>
</div>
<script>
async function openCam(){
try{
let s=await navigator.mediaDevices.getUserMedia({video:true});
document.getElementById('cam').srcObject=s;
document.getElementById('msg').innerText='✅ الكاميرا شغالة';
document.getElementById('msg').style.color='#4ade80';
}catch(e){alert('دوسي على العلامة اللي جنب اللينك فوق واختاري سماح للكاميرا');}
}
</script>
</body>
</html>
