<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusTrack Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0B1220;color:white;padding:12px;display:flex;justify-content:center}
.phone{width:100%;max-width:390px;background:#151E32;border-radius:30px;padding:15px;border:1px solid #1e293b}
.top-video{width:100%;height:340px;background:#000;border-radius:20px;overflow:hidden;position:relative}
.top-video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.card{background:#1E293B;border-radius:18px;padding:14px;margin:14px 0;text-align:center}
.btn{width:90%;background:#7c5cff;color:white;border:none;padding:13px;border-radius:14px;margin:8px auto;display:block;font-size:16px}
.warn{font-size:13px;color:#f87171;margin-top:10px}
.ok{font-size:13px;color:#4ade80;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
<div class="top-video"><video id="cam" autoplay playsinline muted></video></div>
<div class="card">
<button class="btn" onclick="openCam()">📷 شغلي الكاميرا</button>
<button class="btn" style="background:#7c5cff" onclick="closeCam()">⏹️ اقفليها</button>
<div class="warn" id="msg">❌ لازم تسمحي للكاميرا من المتصفح</div>
<div id="status" style="margin-top:10px">حالة التركيز: بانتظار التشغيل</div>
</div>
</div>
<script>
let v=document.getElementById('cam');let s;
async function openCam(){
try{
s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
v.srcObject=s;
document.getElementById('msg').innerText='✅ الكاميرا شغالة';
document.getElementById('msg').className='ok';
document.getElementById('status').innerText='حالة التركيز: مركزة ✅';
}catch(e){
alert('دوسي على علامة القفل 🔒 جنب اللينك فوق واختاري Allow للكاميرا');
}
}
function closeCam(){if(s){s.getTracks().forEach(t=>t.stop());} v.srcObject=null; document.getElementById('msg').innerText='❌ الكاميرا مقفولة';}
</script>
</body>
</html>
