<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusTrack</title>
<style>
body{margin:0;background:#0a1220;color:white;font-family:Arial}
.video-container{width:100%;height:380px;background:black;position:relative;border-radius:0 0 20px 20px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.info-card{background:#162040;margin:12px;border-radius:16px;padding:14px}
.btn-sound{background:#1e2a4a;color:white;border:none;padding:10px 18px;border-radius:20px;display:block;margin:auto}
.small{font-size:12px;color:#8a9bb5;text-align:center;margin-top:8px}
.focus-card{background:#162040;margin:12px;border-radius:16px;padding:20px;text-align:center}
.circle{width:130px;height:130px;border-radius:50%;border:8px solid #1e2a4a;border-top-color:#6c5cff;margin:15px auto;display:flex;align-items:center;justify-content:center;flex-direction:column}
.circle b{font-size:28px}
.warn{background:#2c2400;color:#ffcc00;padding:10px;border-radius:10px;margin-top:15px;font-size:13px}
.start{width:100%;background:#6c5cff;color:white;border:none;padding:14px;border-radius:12px;margin-top:12px;font-size:16px}
</style>
</head>
<body>

<div class="video-container">
<video id="v" autoplay playsinline muted></video>
</div>

<div class="info-card">
<button class="btn-sound">🔊 التنبيه الصوتي: مفعل (عالي)</button>
<p class="small">ℹ️ الإنذار يعمل فور تحريك الرأس يمين/يسار أو تشتت العين<br>ونقص التركيز عن 40%.</p>
</div>

<div class="focus-card">
<p>معدل التركيز العام 📊</p>
<div class="circle" id="c"><b id="p">0%</b><small>متوسط التركيز</small></div>
<div class="warn" id="w">⚠️ لا يوجد طلاب أمام الكاميرا حالياً</div>
<button class="start" onclick="run()" id="b">📷 شغلي الكاميرا</button>
</div>

<script>
let v=document.getElementById('v');
async function run(){
try{
let s=await navigator.mediaDevices.getUserMedia({video:true});
v.srcObject=s;
document.getElementById('b').innerText="✅ الكاميرا شغالة";
document.getElementById('w').innerText="✅ يوجد طالب - التركيز جيد";
document.getElementById('w').style.background="#0a2e15";
document.getElementById('w').style.color="#4ade80";
let pct=0;
let iv=setInterval(()=>{
pct+=5;
if(pct>82){pct=82; clearInterval(iv);}
document.getElementById('p').innerText=pct+"%";
document.getElementById('c').style.borderTopColor="#6c5cff";
document.getElementById('c').style.transform=`rotate(${pct*3.6}deg)`;
},150);
}catch(e){alert("دوسي السماح للكاميرا من فوق");}
}
</script>
</body>
</html>
