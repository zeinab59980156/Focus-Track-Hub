<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusTrack</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><style>*{font-family:Cairo;box-sizing:border-box}body{margin:0;background:#eef4ff;padding-bottom:80px}header{background:#2563eb;color:#fff;padding:14px;text-align:center;border-radius:0 0 18px 18px}.card{background:#fff;border-radius:16px;padding:14px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}#camBox{position:relative;width:88%;max-width:360px;margin:10px auto;background:#000;border-radius:24px;overflow:hidden;border:3px solid #2563eb;aspect-ratio:9/16;height:540px;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain!important;transform:scaleX(-1);background:#000}canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}.circle{width:140px;height:140px;border-radius:50%;border:10px solid #e5e7eb;display:flex;align-items:center;justify-content:center;margin:10px auto}.circle.green{border-color:#16a34a}.circle.red{border-color:#ef4444}.circle b{font-size:36px}.btn{background:#2563eb;color:#fff;border:none;padding:12px;border-radius:12px;width:100%;font-weight:800;font-size:16px;cursor:pointer}.alertTone{background:#fee2e2;color:#dc2626;padding:10px;border-radius:10px;text-align:center;font-weight:800;display:none;margin-top:10px}</style></head><body>
<header><h1>FocusTrack</h1><p>ركز أكثر، تعلم أفضل</p></header>

<div class="card" style="text-align:center">
<div id="camBox"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div id="place" style="position:absolute;color:#fff">اضغط بدء الكاميرا</div></div>
<div id="circle" class="circle green"><b id="f">--%</b></div>
<p id="state">--</p>
<div id="toneAlert" class="alertTone"></div>
<button id="start" class="btn">▶ بدء الكاميرا</button>
<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
</div>

<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const fEl=document.getElementById('f'),stateEl=document.getElementById('state'),circle=document.getElementById('circle'),toneAlert=document.getElementById('toneAlert'),beepAudio=document.getElementById('beep');
let eyeClosedStart=null, headTiltStart=null, lowFocusStart=null;
let audioCtx=null;

function playBeep(reason){
  try{
    beepAudio.currentTime=0;
    beepAudio.play().catch(()=>{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value=1000; gain.gain.value=0.5;
      osc.start(); setTimeout(()=>osc.stop(),500);
    });
    if(navigator.vibrate) navigator.vibrate([300,100,300]);
    toneAlert.style.display='block';
    toneAlert.textContent=`🔔 ${reason}`;
  }catch(e){}
}

function calc(l){
  const nose=l[1], eyeT=l[159], eyeB=l[145], fore=l[10], chin=l[152];
  const yaw=Math.abs(nose.x-0.5);
  const pitch=fore.y-chin.y;
  const eyeOpen=Math.abs(eyeT.y-eyeB.y);
  const isEyeClosed = eyeOpen < 0.007;
  const isHeadTilt = yaw > 0.13 || pitch < 0.22;
  let score=100;
  if(isHeadTilt) score-=35;
  if(isEyeClosed) score-=50;
  if(pitch<0.22) score-=20;
  score=Math.max(0,Math.min(100,Math.round(score)));
  const isLowFocus = score < 50;
  return {score, isEyeClosed, isHeadTilt, isLowFocus};
}

function onR(r){
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(r.image,0,0,canvas.width,canvas.height);
  if(r.multiFaceLandmarks && r.multiFaceLandmarks[0]){
    const res=calc(r.multiFaceLandmarks[0]);
    fEl.textContent=res.score+'%';
    circle.className=res.score>=50?'circle green':'circle red';
    fEl.style.color=res.score>=50?'#16a34a':'#ef4444';
    stateEl.textContent=`${res.score}%`;

    // 1 - العين مقفولة -> فوراً
    if(res.isEyeClosed){
      if(!eyeClosedStart) eyeClosedStart=Date.now();
      playBeep('عينك مقفولة');
      eyeClosedStart=Date.now(); // يرن فورا كل مرة
    }else{
      eyeClosedStart=null;
    }

    // 2 - ميل الوش -> بعد 5 ثواني
    if(res.isHeadTilt && !res.isEyeClosed){
      if(!headTiltStart) headTiltStart=Date.now();
      let diff=(Date.now()-headTiltStart)/1000;
      stateEl.textContent=`مال بوشه - ${Math.round(diff)}ث / 5`;
      if(diff>=5){
        playBeep('مال بوشه بقاله 5 ثواني');
        headTiltStart=Date.now()-4000; // يرن كل ثانية بعد الـ 5
      }
    }else if(!res.isEyeClosed){
      headTiltStart=null;
    }

    // 3 - تركيز اقل من 50% -> بعد 5 ثواني (لو مش بسبب العين)
    if(res.isLowFocus && !res.isEyeClosed && !res.isHeadTilt){
      if(!lowFocusStart) lowFocusStart=Date.now();
      let diff=(Date.now()-lowFocusStart)/1000;
      stateEl.textContent=`تركيز منخفض ${res.score}% - ${Math.round(diff)}ث / 5`;
      if(diff>=5){
        playBeep(`تركيزك ${res.score}% بقاله 5 ثواني`);
        lowFocusStart=Date.now()-4000;
      }
    }else if(!res.isHeadTilt){
      lowFocusStart=null;
    }

    // لو كله تمام اخفي التنبيه
    if(!res.isEyeClosed && !res.isHeadTilt && !res.isLowFocus){
      toneAlert.style.display='none';
      stateEl.textContent=`✅ تركيز جيد ${res.score}%`;
    }
  }
}

const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.6});
faceMesh.onResults(onR);

document.getElementById('start').onclick=async()=>{
  document.getElementById('place').style.display='none';
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  beepAudio.load();
  const cam=new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video});},width:640,height:480});
  await cam.start();
  document.getElementById('start').style.display='none';
  playBeep('الكاميرا شغالة ✅');
  setTimeout(()=>toneAlert.style.display='none',1500);
};
</script></body></html>
