<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Track Hub</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><style>*{font-family:Cairo;box-sizing:border-box}body{margin:0;background:#f0f7ff}header{background:#2563eb;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}.landing{max-width:900px;margin:30px auto;padding:20px;text-align:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.cards{grid-template-columns:1fr}}.role-card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 8px 30px rgba(37,99,235,.15);border-top:6px solid #2563eb}.role-card.teacher{border-top-color:#16a34a}.btn{padding:14px;border-radius:12px;border:none;font-weight:800;cursor:pointer;width:100%;color:#fff}.btn-s{background:#2563eb}.btn-t{background:#16a34a}#studentView,#teacherView{display:none;max-width:1200px;margin:20px auto;padding:15px}.white-box{background:#fff;border-radius:16px;padding:20px}#container{position:relative;width:90%;max-width:380px;margin:15px auto;background:#000;border-radius:24px;overflow:hidden;border:3px solid #2563eb;aspect-ratio:9/16;height:620px;max-height:75vh;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain!important;transform:scaleX(-1);display:block;background:#000}canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);object-fit:contain}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}.card-stat{background:#f8fbff;border:2px solid #dbeafe;border-radius:12px;padding:12px;text-align:center}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:center}</style></head><body>
<header><div>🇪🇬 Focus Track Hub</div><div id="backBtn" style="display:none;cursor:pointer" onclick="location.reload()">⬅ رجوع</div></header>
<div id="landing" class="landing"><h1 style="color:#1e40af">منصة تعليمية موحدة</h1><p>اختر نوع الحساب</p><div class="cards"><div class="role-card" onclick="openStudent()"><div style="font-size:50px">👩‍🎓</div><h2>واجهة الطالب</h2><button class="btn btn-s">→ دخول الطالب</button></div><div class="role-card teacher" onclick="openTeacher()"><div style="font-size:50px">👨‍🏫</div><h2>واجهة المعلم</h2><button class="btn btn-t">→ دخول المعلم</button></div></div></div>
<div id="studentView"><div class="white-box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><h2>🎥 جلسة التركيز</h2><button id="startBtn" class="btn btn-s" style="width:auto">▶ بدء الكاميرا</button></div><div id="statusBox" style="background:#eff6ff;padding:10px;border-radius:10px;text-align:center;margin-top:10px">الكاميرا طويلة والوش طبيعي مش بيتغير</div><div id="container"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><div class="stats"><div class="card-stat"><div>التركيز</div><b id="focusValue">--%</b></div><div class="card-stat"><div>العين</div><b id="eyeDir">--</b></div><div class="card-stat"><div>الرأس</div><b id="headDir">--</b></div><div class="card-stat"><div>الوجه</div><b id="eyeState">--</b></div></div><audio id="alertAudio" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio></div></div>
<div id="teacherView"><div class="white-box"><h2 style="color:#16a34a">👨‍🏫 لوحة المعلم</h2><table><tr><th>الطالب</th><th>التركيز</th><th>العين</th><th>الرأس</th></tr><tr><td>زينب</td><td id="t_focus" style="color:red">--%</td><td id="t_eye">--</td><td id="t_head">--</td></tr><tr><td>أحمد</td><td style="color:green">85%</td><td>للشاشة</td><td>ثابت</td></tr></table></div></div>
<script>
function openStudent(){document.getElementById('landing').style.display='none';document.getElementById('studentView').style.display='block';document.getElementById('backBtn').style.display='block';}
function openTeacher(){document.getElementById('landing').style.display='none';document.getElementById('teacherView').style.display='block';document.getElementById('backBtn').style.display='block';}
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),focusValue=document.getElementById('focusValue'),eyeDirEl=document.getElementById('eyeDir'),headDirEl=document.getElementById('headDir'),eyeStateEl=document.getElementById('eyeState'),statusBox=document.getElementById('statusBox'),alertAudio=document.getElementById('alertAudio');let lastBeep=0,audioCtx;function playAlert(){if(Date.now()-lastBeep<3000)return;lastBeep=Date.now();alertAudio.currentTime=0;alertAudio.play().catch(()=>{});try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(900,audioCtx.currentTime);g.gain.setValueAtTime(0.8,audioCtx.currentTime);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.5);}catch(e){}if(navigator.vibrate)navigator.vibrate([400,100,400]);}function calcFocus(l){let s=100,eyeD='للشاشة ✅',headD='ثابت ✅',eyeS='مفتوحة ✅';const nose=l[1],eyeT=l[159],eyeB=l[145],fore=l[10],chin=l[152],mT=l[13],mB=l[14];const yaw=nose.x-0.5;if(Math.abs(yaw)>0.13){s-=35;eyeD=yaw>0?'يمين ➡️':'شمال ⬅️';headD='لافف';}const pitch=fore.y-chin.y;if(pitch<0.2){s-=30;headD='موطي ⬇️';}else if(pitch>0.4){s-=20;headD='رافع ⬆️';}const eyeOpen=Math.abs(eyeT.y-eyeB.y);if(eyeOpen<0.006){s-=50;eyeS='مقفولة 😴';}const mouthOpen=Math.abs(mT.y-mB.y);if(mouthOpen>0.06){s-=15;eyeS='تثاؤب 🥱';}return{score:Math.max(0,Math.min(100,Math.round(s))),eyeD,headD,eyeS};}function onResults(r){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(r.image,0,0,canvas.width,canvas.height);if(r.multiFaceLandmarks&&r.multiFaceLandmarks.length>0){const res=calcFocus(r.multiFaceLandmarks[0]);focusValue.textContent=res.score+'%';eyeDirEl.textContent=res.eyeD;headDirEl.textContent=res.headD;eyeStateEl.textContent=res.eyeS;document.getElementById('t_focus').textContent=res.score+'%';document.getElementById('t_eye').textContent=res.eyeD;document.getElementById('t_head').textContent=res.headD;if(res.score<50)playAlert();}}const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.6});faceMesh.onResults(onResults);document.getElementById('startBtn').onclick=async()=>{try{alertAudio.play().then(()=>alertAudio.pause()).catch(()=>{});if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const cam=new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video});},width:640,height:480});await cam.start();statusBox.textContent='✅ الوش طبيعي ومش بيتغير - الإطار بس هو اللي طويل';document.getElementById('startBtn').style.display='none';}catch(e){statusBox.textContent='فشل: '+e.message}};
</script></body></html>
