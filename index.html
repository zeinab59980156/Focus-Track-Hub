<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Track Hub</title>
<style>
  body{font-family:sans-serif;background:#0f172a;color:white;margin:0;padding:20px;text-align:center}
  h1{color:#38bdf8}
  #container{position:relative;max-width:640px;margin:20px auto;border:3px solid #38bdf8;border-radius:20px;overflow:hidden;background:black}
  video{width:100%;transform:scaleX(-1);display:block}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}
  #stats{display:flex;justify-content:space-around;margin-top:20px;flex-wrap:wrap;gap:10px}
  .card{background:#1e293b;padding:15px 20px;border-radius:15px;min-width:140px}
  .card h3{margin:5px 0;color:#94a3b8;font-size:14px}
  .card p{margin:0;font-size:28px;font-weight:bold}
  button{background:#38bdf8;color:#0f172a;border:none;padding:15px 35px;font-size:18px;border-radius:50px;font-weight:bold;cursor:pointer;margin-top:15px}
  #status{margin-top:15px;color:#facc15}
  .low{color:#ef4444 !important;animation:blink 0.8s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<h1>🎯 Focus Track Hub</h1>
<p>التركيز من اتجاه العين وحركة الرأس وملامح الوجه</p>
<button id="startBtn">▶ بدء متابعة التركيز - شغلي الكاميرا الحقيقية</button>
<p id="status">دوسي الزرار واقفلي فقاعات الشات</p>
<div id="container"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div>
<div id="stats">
  <div class="card"><h3>نسبة التركيز</h3><p id="focusValue">--%</p></div>
  <div class="card"><h3>اتجاه العين</h3><p id="eyeDir" style="font-size:18px">--</p></div>
  <div class="card"><h3>حركة الرأس</h3><p id="headDir" style="font-size:18px">--</p></div>
  <div class="card"><h3>حالة العين</h3><p id="eyeState" style="font-size:18px">--</p></div>
</div>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),focusValue=document.getElementById('focusValue'),eyeDirEl=document.getElementById('eyeDir'),headDirEl=document.getElementById('headDir'),eyeStateEl=document.getElementById('eyeState'),statusEl=document.getElementById('status');
let lastBeep=0,audioCtx;
function beep(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.8,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+0.4);if(navigator.vibrate)navigator.vibrate([300,100,300]);}catch(e){}}
function calcFocus(l){const nose=l[1],eyeTop=l[159],eyeBottom=l[145],forehead=l[10],chin=l[152],mouthTop=l[13],mouthBottom=l[14];let score=100,eyeDir='للشاشة ✅',headDir='ثابت ✅',eyeState='مفتوحة ✅';const yaw=nose.x-0.5;if(Math.abs(yaw)>0.12){score-=35;eyeDir=yaw>0?'يمين ➡️':'شمال ⬅️';headDir='لافف راسك';}const pitch=forehead.y-chin.y;if(pitch<0.22||pitch>0.38){score-=25;headDir=pitch<0.22?'موطي راسك ⬇️':'رافع راسك ⬆️';}const eyeOpen=Math.abs(eyeTop.y-eyeBottom.y);if(eyeOpen<0.008){score-=45;eyeState='مقفولة 😴';}else if(eyeOpen<0.012){score-=15;eyeState='هتنامي';}const mouthOpen=Math.abs(mouthTop.y-mouthBottom.y);if(mouthOpen>0.05){score-=10;eyeState='تثاؤب 🥱';}return{score:Math.max(0,Math.min(100,Math.round(score))),eyeDir,headDir,eyeState};}
function onResults(r){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(r.image,0,0,canvas.width,canvas.height);if(r.multiFaceLandmarks&&r.multiFaceLandmarks.length>0){const res=calcFocus(r.multiFaceLandmarks[0]);focusValue.textContent=res.score+'%';eyeDirEl.textContent=res.eyeDir;headDirEl.textContent=res.headDir;eyeStateEl.textContent=res.eyeState;if(res.score>=70){focusValue.style.color='#22c55e';focusValue.classList.remove('low');statusEl.textContent='ممتاز! مركزة ✅';}else if(res.score>=50){focusValue.style.color='#facc15';focusValue.classList.remove('low');statusEl.textContent='ركزي شوية ⚠️';}else{focusValue.style.color='#ef4444';focusValue.classList.add('low');statusEl.textContent='تركيزك قل عن 50% - ارجعي للشاشة! 🔔';if(Date.now()-lastBeep>2500){beep();lastBeep=Date.now();}}}else{focusValue.textContent='0%';statusEl.textContent='مش شايف وشك - اقربي';}}
const faceMesh=new FaceMesh({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.6,minTrackingConfidence:0.6});faceMesh.onResults(onResults);
document.getElementById('startBtn').onclick=async()=>{statusEl.textContent='بشغل الكاميرا...';try{const cam=new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video});},width:640,height:480});await cam.start();statusEl.textContent='الكاميرا شغالة';document.getElementById('startBtn').style.display='none';}catch(e){statusEl.textContent='فشل: '+e.message;}};
</script>
</body>
</html>
